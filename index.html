<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIRA — Guía del MVP</title>
<style>
:root{--y:#F5C518;--n:#0E2A3F;--t:#7FD1C3;--bg:#F7F8FA;--card:#fff;--tx:#1a1a1a;--mu:#5b6570;--bd:#d7dce2;--in:#fff;--ok:#1f8a4c;--rev:#c27c00;--prog:#2a6fdb;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#16212c;--tx:#e8edf2;--mu:#9aa7b4;--bd:#2c3a48;--in:#0f1a24;--n:#9cc8ff;}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#16212c;--tx:#e8edf2;--mu:#9aa7b4;--bd:#2c3a48;--in:#0f1a24;--n:#9cc8ff;}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
.top{position:sticky;top:0;z-index:5;background:#0E2A3F;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:4px solid var(--y)}
.brand{font-weight:700;font-size:18px;letter-spacing:.3px}.brand span{color:var(--y)}
.gprog{flex:1;min-width:180px}.bar{height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y);width:0;transition:width .3s}
#gtext{font-size:12px;opacity:.9}
.topbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--y);color:#1a1a1a;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;font-weight:600}
.top .btn.ghost{color:#fff}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.icon{background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:6px;width:32px;height:32px;cursor:pointer}
.icon:hover{color:#b00020;border-color:#b00020}
:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:0;max-width:1500px;margin:0 auto}
aside{border-right:1px solid var(--bd);padding:12px 8px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
#nav{list-style:none;margin:0;padding:0}
#nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
#nav button:hover{background:rgba(127,209,195,.18)}#nav button.cur{background:rgba(245,197,24,.28);font-weight:700}
.nn{min-width:20px;color:var(--mu);font-size:12px}.nt{flex:1}.np{font-size:11px;color:var(--mu);margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--mu);flex:none}
.dot.prog{background:var(--prog);border-color:var(--prog)}.dot.rev{background:var(--rev);border-color:var(--rev)}.dot.ok{background:var(--ok);border-color:var(--ok)}
.legend{font-size:12px;color:var(--mu);padding:10px 8px;display:flex;flex-wrap:wrap;gap:8px}.legend span{display:inline-flex;gap:4px;align-items:center}
#navsel{display:none;width:100%;margin:10px 0;padding:10px;font:inherit;border-radius:8px;border:1px solid var(--bd);background:var(--in);color:var(--tx)}
main{padding:20px 28px 60px;min-width:0}
.kicker{margin:0;color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
h2{margin:2px 0 10px;font-size:26px;color:var(--n)}h2:focus{outline:none}
h3{color:var(--n);font-size:17px;margin:0}
.guide{background:var(--card);border-left:5px solid var(--y);padding:10px 14px;border-radius:6px;margin-bottom:12px}
.muted{color:var(--mu);font-size:13px}
.statusrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.statusrow select{width:auto;min-width:180px;padding:6px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit}
.pill{background:var(--t);color:#0E2A3F;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px 18px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}.field label{font-weight:700;font-size:14px}
input[type=text],input[type=date],textarea,select{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:8px 9px;width:100%}
textarea{resize:vertical;min-height:42px}
table.edit td textarea{overflow:hidden;min-height:34px}
.tblock{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:14px 0}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.tscroll{overflow-x:auto;margin-bottom:8px}
table.edit{border-collapse:collapse;width:100%;table-layout:fixed}
table.edit th{background:#0E2A3F;color:#fff;text-align:left;font-size:13px;padding:7px;position:sticky;top:0}
table.edit td{border-bottom:1px solid var(--bd);padding:4px;vertical-align:top}
table.edit td input,table.edit td textarea,table.edit td select{font-size:13px;padding:6px;border-color:transparent;background:transparent}
table.edit td input:focus,table.edit td textarea:focus,table.edit td select:focus{border-color:var(--bd);background:var(--in)}
table.edit tr:hover td{background:rgba(127,209,195,.08)}
.check{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:14px 0;background:var(--card)}
.check legend{font-weight:700;color:var(--n);padding:0 6px}
.ci{display:grid;grid-template-columns:1fr 260px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--bd)}
.ci label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.ci input[type=checkbox]{width:20px;height:20px;margin-top:1px;flex:none}
.nota{font-size:13px!important;padding:5px 7px!important}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pager{display:flex;justify-content:space-between;margin-top:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 18px}
.kpis div{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--y);border-radius:8px;padding:12px}.kpis b{display:block;font-size:26px;color:var(--n)}.kpis span{color:var(--mu);font-size:13px}
.exportbox{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:18px}.exportbox .btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.audit details{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:6px 0;padding:8px 12px}
.audit summary{cursor:pointer;display:flex;gap:8px;align-items:center}
.audit ul{margin:8px 0;padding-left:20px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#report{display:none}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border:0;padding:0 16px}#nav,.legend{display:none}#navsel{display:block}main{padding:12px 16px 50px}.ci{grid-template-columns:1fr}.top{position:static}}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;color:#1a1a1a;font-size:10.5pt}
  .top,.layout{display:none!important}#report{display:block}
  #report h1{font-size:20pt;color:#0E2A3F;margin:0}#report .rsub{color:#555;margin:2px 0 10px}
  #report h2{background:#F5C518;padding:5px 8px;font-size:13pt;margin:16px 0 4px;break-after:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report h3{font-size:11pt;color:#0E2A3F;margin:10px 0 4px;break-after:avoid}
  #report .rmeta{font-style:italic;color:#555;font-size:9pt;margin:0 0 6px}
  #report .rf{margin:4px 0 8px;break-inside:avoid}#report .rf b{display:block}
  #report table{border-collapse:collapse;width:100%;font-size:8.5pt;margin-bottom:8px}
  #report th{background:#0E2A3F;color:#fff;text-align:left;padding:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report td{border:1px solid #ccc;padding:4px;vertical-align:top}#report tr{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">NIRA <span>·</span> Guía del MVP</div>
  <div class="gprog"><div class="bar" role="progressbar" aria-label="Avance general"><i id="gbar"></i></div><div id="gtext"></div></div>
  <div class="topbtns">
    <button type="button" class="btn small" data-exp="xlsx">Excel</button>
    <button type="button" class="btn small" data-exp="docx">Word</button>
    <button type="button" class="btn small" data-exp="pdf">PDF</button>
    <button type="button" class="btn ghost small" data-exp="json" title="Descargar respaldo para continuar en otra computadora">Respaldo</button>
    <button type="button" class="btn ghost small" id="btnImport" title="Cargar un respaldo .json">Importar</button>
    <button type="button" class="btn ghost small" id="btnReset" title="Volver al borrador inicial">Reiniciar</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>
<div class="layout">
  <aside>
    <label class="sr" for="navsel">Ir al paso</label><select id="navsel"></select>
    <ol id="nav"></ol>
    <div class="legend"><span><i class="dot"></i>Pendiente</span><span><i class="dot prog"></i>En progreso</span><span><i class="dot rev"></i>En revisión</span><span><i class="dot ok"></i>Validado</span></div>
    <p class="muted" id="saved" style="padding:0 8px" role="status" aria-live="polite"></p>
  </aside>
  <main id="main"></main>
</div>
<div id="report"></div>
<script>
/* ====== CONTENIDO DE LA GUÍA (editable) ====== */
const PRIO = ["Must — imprescindible", "Should — importante", "Could — deseable", "Won't — fuera del MVP"];
const ROLES = ["Todos", "PM / BA", "UX/UI", "Frontend", "Backend", "QA", "Data", "Diseño gráfico", "Legal / GRC"];
const EST_BACK = ["Propuesto — pendiente de validación", "To Do", "En progreso", "En revisión", "Hecho", "Bloqueado"];
const EST_SIMPLE = ["Pendiente", "En progreso", "En revisión", "Validado", "Descartado"];
const SINO = ["Sí", "Parcial", "No", "A definir"];
const NIVEL = ["Alta", "Media", "Baja"];

const SECTIONS = [
/* 0 ------------------------------------------------------------ */
{ id: "inicio", n: "0", title: "Datos del proyecto",
  guide: "Completá los datos generales. La fecha de inicio se usa para calcular las fechas del backlog (Semana 0 = semana de inicio).",
  roles: "PM / BA",
  fields: [
    { id: "proyecto", label: "Nombre del proyecto", def: "NIRA: Talento y Futuro" },
    { id: "version", label: "Versión del documento", def: "v0.1 — Borrador para revisión del equipo" },
    { id: "fechaInicio", label: "Fecha de inicio (Semana 0)", type: "date" },
    { id: "fechaEntrega", label: "Fecha objetivo de entrega final", type: "date" },
    { id: "semanas", label: "Duración", def: "Sprint Planning (Semana 0) + 8 semanas (4 sprints de 2 semanas)" },
    { id: "responsable", label: "Responsable del documento / PM", ph: "Nombre y rol" },
    { id: "equipo", label: "Equipo y roles", type: "area", ph: "Una persona por línea: Nombre — Rol — Disponibilidad (h/semana)" },
    { id: "stakeholders", label: "Stakeholders / cliente", type: "area", ph: "Organización, contacto, qué espera del MVP" },
    { id: "enlaces", label: "Enlaces de trabajo", type: "area", ph: "Repositorio GitHub:\nFigma:\nJira / Trello:\nDrive / documentación:\nDeploy (front / back):" },
  ],
  tables: [
    { id: "fuentes", label: "Fuentes utilizadas", cols: [
      { k: "fuente", label: "Fuente", w: 30 }, { k: "uso", label: "Para qué se usó", type: "area", w: 50 }, { k: "estado", label: "Estado", type: "select", options: EST_SIMPLE, w: 20 } ],
      rows: [
        { fuente: "Video «NIRA: Talento y Futuro» (5:48 min)", uso: "Visión, 6 pilares, recorrido del usuario, privacidad, habilidades, competencias e insignias. Base de la trazabilidad (paso 1).", estado: "En revisión" },
        { fuente: "Documento «Calculadora Inteligente» (Innova Lab)", uso: "Estructura del documento de producto: identificación, problemática, solución, funcionalidades, requisitos mínimos, future scope, tecnologías y plan semanal por rol.", estado: "Validado" },
        { fuente: "Backlog y cronograma UrbanFix (Talently Lab)", uso: "Formato de backlog por semana y rol, cronograma con hitos y checkpoints, notas de validación.", estado: "Validado" },
        { fuente: "Plantilla de Proyecto (HTML)", uso: "Campos base y paleta de colores del documento.", estado: "Validado" },
      ] } ],
},
/* 1 ------------------------------------------------------------ */
{ id: "vision", n: "1", title: "Visión y trazabilidad con el video",
  guide: "Cada elemento del video tiene que terminar en al menos un módulo y un requisito del MVP. Si algo queda en «No», el MVP no cumple lo que muestra el video o hay que justificar por qué queda fuera.",
  roles: "PM / BA · UX/UI",
  fields: [
    { id: "pregunta", label: "Pregunta disparadora", def: "¿Y si el futuro no tuviera que esperar en una fila?" },
    { id: "mision", label: "Misión", type: "area", def: "Acercar herramientas y conocimientos a todos para que la tecnología genere confianza sin dejar a nadie atrás." },
    { id: "lema", label: "Lema de cierre", def: "La tecnología conecta. El talento transforma. Cada habilidad abre un camino." },
    { id: "pitch", label: "Pitch en una frase (para la demo)", type: "area", ph: "Ej.: NIRA reemplaza las filas y los CV impresos por una identidad digital con QR, capacitación y evaluación gamificada que termina en insignias verificables y oportunidades reales de empleo." },
  ],
  tables: [
    { id: "traza", label: "Trazabilidad video → MVP", cols: [
      { k: "elem", label: "Elemento del video", w: 22 }, { k: "mensaje", label: "Qué dice / muestra", type: "area", w: 30 },
      { k: "modulo", label: "Módulo del MVP", w: 18 }, { k: "rf", label: "RF asociados", w: 12 }, { k: "cub", label: "¿Cubierto?", type: "select", options: SINO, w: 10 } ],
      rows: [
        { elem: "1. El fin de las filas", mensaje: "Tiempo y talento perdido: pilas de CV impresos y filas interminables («seiscientas personas para un solo puesto»). Entrada ágil con QR y un currículum vivo y digital.", modulo: "Eventos y acceso QR", rf: "RF-07 a RF-10", cub: "Sí" },
        { elem: "2. Identidad Digital", mensaje: "El puente hacia el futuro. Acceder a eventos mediante tu identidad digital.", modulo: "Identidad digital / CV vivo", rf: "RF-01 a RF-06", cub: "Sí" },
        { elem: "Recorrido: Acceder", mensaje: "A eventos mediante tu identidad digital.", modulo: "Eventos y acceso QR", rf: "RF-08, RF-09", cub: "Sí" },
        { elem: "Recorrido: Descubrir", mensaje: "Reconocer intereses y habilidades.", modulo: "Descubrir (test de intereses)", rf: "RF-11", cub: "Sí" },
        { elem: "Recorrido: Aprender", mensaje: "Capacitarse con experiencias digitales.", modulo: "Aprender (rutas de capacitación)", rf: "RF-12, RF-13", cub: "Sí" },
        { elem: "Recorrido: Conectar", mensaje: "Vincular el perfil con el empleo.", modulo: "Acceso al empleo", rf: "RF-20 a RF-23", cub: "Sí" },
        { elem: "Recorrido: Demostrar", mensaje: "Validar competencias e insignias.", modulo: "Certificación", rf: "RF-17 a RF-19", cub: "Sí" },
        { elem: "Identidad y Privacidad", mensaje: "Consentimiento informado para todos los datos; acceso controlado; actualizar y corregir datos; autorización específica para compartir el CV; protección especial de datos de menores.", modulo: "Privacidad y consentimiento", rf: "RF-03, RF-05, RF-06, RF-21, RF-24", cub: "Sí" },
        { elem: "3. Capacitación Inclusiva", mensaje: "Sin dejar a nadie atrás. Acerca herramientas y conocimientos a todos.", modulo: "Aprender + accesibilidad", rf: "RF-12, RNF-03", cub: "Sí" },
        { elem: "4. Evaluación Gamificada", mensaje: "Descubrir el potencial. Habilidades del juego: adaptabilidad, resolución de problemas, trabajo en equipo, IA generativa, análisis de datos, gestión de proyectos.", modulo: "Misiones y evidencias", rf: "RF-14 a RF-16", cub: "Sí" },
        { elem: "Competencia → Evidencia → Digital Badge", mensaje: "Resolución de problemas → superación de desafío; Trabajo en equipo → misión colaborativa; IA generativa → actividad con IA; Análisis de datos → interpretar un caso; Gestión de proyectos → entrega de misión.", modulo: "Misiones + Certificación", rf: "RF-15, RF-17", cub: "Sí" },
        { elem: "5. Certificación", mensaje: "Insignias digitales: activo profesional de confianza, contratación, democratizar el acceso al empleo digno.", modulo: "Certificación (insignias verificables)", rf: "RF-17 a RF-19", cub: "Sí" },
        { elem: "6. Acceso al Empleo", mensaje: "Oportunidades reales.", modulo: "Acceso al empleo (empresas y ofertas)", rf: "RF-20 a RF-23", cub: "Sí" },
      ] } ],
},
/* 2 ------------------------------------------------------------ */
{ id: "identificacion", n: "2", title: "Identificación del producto",
  guide: "Misma estructura que el documento de producto de referencia. Escribí en lenguaje simple: lo va a leer el cliente.",
  roles: "PM / BA",
  fields: [
    { id: "nombreProd", label: "Nombre del producto", def: "NIRA: Talento y Futuro" },
    { id: "tipo", label: "Tipo de solución", type: "area", def: "Plataforma web responsive de identidad digital, capacitación y empleabilidad, con acceso a eventos por QR, evaluación gamificada y certificación con insignias digitales." },
    { id: "usuarios", label: "Usuarios principales", type: "area", def: "Personas que buscan empleo o desarrollar habilidades (incluye jóvenes y menores con autorización), empresas que buscan talento, y organizaciones que realizan eventos de empleo y capacitación." },
    { id: "proposito", label: "Propósito", type: "area", def: "Que cada persona tenga un perfil vivo y verificable con sus intereses, aprendizajes y competencias demostradas, y pueda usarlo para acceder a eventos y oportunidades laborales sin filas ni papeles." },
    { id: "necesidad", label: "Necesidad que aborda", type: "area", def: "Los procesos de empleo masivos siguen basados en CV impresos y filas. El talento que no está en el papel (habilidades blandas, aprendizajes recientes) no se ve, y las empresas no tienen evidencias confiables de competencias." },
    { id: "funcion", label: "Función principal (recorrido guiado)", type: "area", def: "• Acceder: registrarse y obtener una identidad digital con QR.\n• Descubrir: reconocer intereses y habilidades.\n• Aprender: capacitarse con experiencias digitales.\n• Demostrar: superar misiones y obtener insignias verificables.\n• Conectar: compartir el perfil, con autorización, con empresas y ofertas reales." },
  ] },
/* 3 ------------------------------------------------------------ */
{ id: "problematica", n: "3", title: "Problemática",
  guide: "Describí el problema con datos o ejemplos concretos. Si tenés cifras del cliente o de eventos reales, agregalas.",
  roles: "PM / BA · UX/UI",
  fields: [
    { id: "problema", label: "Descripción del problema", type: "area", def: "En los eventos y procesos de empleo, cientos de personas esperan en filas con CV impresos para un solo puesto. Se pierde tiempo y talento: el papel no muestra lo que la persona sabe hacer, y quien no tiene experiencia formal queda afuera." },
    { id: "dolores", label: "Puntos de dolor", type: "area", def: "• Filas largas y pilas de CV impresos en ferias y convocatorias.\n• CV estáticos, desactualizados y sin evidencias verificables.\n• Habilidades blandas y digitales invisibles para el empleador.\n• Brecha de acceso a capacitación en herramientas actuales (IA, datos).\n• Datos personales que circulan sin control (copias impresas, planillas).\n• Las empresas no pueden filtrar ni validar competencias rápidamente." },
    { id: "evidencia", label: "Evidencia / datos que respaldan el problema", type: "area", ph: "Fuente, cifra, fecha. Ej.: cantidad de asistentes por evento, tiempo de espera promedio, % de CV en papel." },
  ] },
/* 4 ------------------------------------------------------------ */
{ id: "solucion", n: "4", title: "Solución propuesta",
  guide: "Explicá cómo NIRA resuelve cada punto de dolor y qué la diferencia.",
  roles: "PM / BA",
  fields: [
    { id: "descSol", label: "Descripción de la solución", type: "area", def: "Una plataforma donde la persona crea su identidad digital (perfil + CV vivo) y obtiene un QR personal para entrar a eventos. Dentro de NIRA descubre sus intereses, se capacita, demuestra competencias en misiones gamificadas y recibe insignias digitales verificables. Con su autorización, comparte su perfil con empresas y se postula a oportunidades reales." },
    { id: "valor", label: "Valor agregado", type: "area", def: "• Para la persona: un activo profesional de confianza que crece con cada logro.\n• Para la empresa: evidencias verificables de competencias, no solo declaraciones.\n• Para el organizador: eventos sin filas, con datos de asistencia y resultados.\n• Privacidad por diseño: la persona decide qué comparte y con quién." },
    { id: "diferencial", label: "Diferencial frente a alternativas", type: "area", ph: "Comparar con bolsas de empleo, LinkedIn, plataformas de cursos. ¿Qué hace NIRA que ellas no?" },
  ] },
/* 5 ------------------------------------------------------------ */
{ id: "usuarios", n: "5", title: "Perfiles de usuario y recorrido",
  guide: "Definí quién usa NIRA y qué hace en cada etapa. Cada etapa del recorrido debe tener una pantalla y una métrica.",
  roles: "UX/UI · PM / BA",
  tables: [
    { id: "perfiles", label: "Perfiles de usuario (roles del sistema)", cols: [

},

      rows: [
        { dec: "Edad mínima y tratamiento de menores.", op: "13+ con tutor / 16+ con tutor / solo mayores en el MVP", resp: "Cliente + Legal", fecha: "", est: "Pendiente" },
        { dec: "¿Las empresas buscan perfiles o solo reciben postulaciones?", op: "Solo postulaciones / búsqueda de perfiles visibles", resp: "Cliente", fecha: "", est: "Pendiente" },

</script>
<script>
/* ====== MOTOR DE LA GUÍA ====== */
(function () {
"use strict";
const KEY = "nira-mvp-guia-v1";
const STATUS = ["Pendiente", "En progreso", "En revisión", "Validado"];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const FINAL = { id: "cierre", n: String(SECTIONS.length), title: "Revisión final y exportación" };
const STEPS = SECTIONS.concat([FINAL]);

/* ---------- estado ---------- */
function defaults() {
  const st = { v: {}, t: {}, c: {}, s: {}, cur: 0, saved: null };
  SECTIONS.forEach(sec => {
    (sec.fields || []).forEach(f => st.v[f.id] = f.def || "");
    (sec.tables || []).forEach(t => st.t[t.id] = clone(t.rows || []));
    (sec.checklists || []).forEach(l => st.c[l.id] = l.items.map(() => ({ ok: false, nota: "" })));
    st.s[sec.id] = "Pendiente";
  });
  return st;
}
function load() {
  const d = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return d;
    const p = JSON.parse(raw);
    ["v", "t", "c", "s"].forEach(k => Object.assign(d[k], p[k] || {}));
    d.cur = Math.min(p.cur || 0, STEPS.length - 1); d.saved = p.saved || null;
  } catch (e) { /* almacenamiento no disponible */ }
  return d;
}
let S = load();
let saveTimer = null;
function persist() {
  clearTimeout(saveTimer); saveTimer = null;
  S.saved = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); setSaved(); }
  catch (e) { $("#saved").textContent = "No se pudo guardar en este navegador: exportá un respaldo (JSON)."; }
}
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { persist(); refreshNav(); }, 300);
}
window.addEventListener("pagehide", () => { if (saveTimer) persist(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveTimer) persist(); });
function setSaved() {
  if (!S.saved) { $("#saved").textContent = "Sin cambios guardados"; return; }
  const d = new Date(S.saved);
  $("#saved").textContent = "Guardado automático · " + d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

/* ---------- completitud ---------- */
const filled = v => String(v == null ? "" : v).trim() !== "";
function secStats(sec) {
  let tot = 0, ok = 0; const miss = [];
  (sec.fields || []).forEach(f => { tot++; if (filled(S.v[f.id])) ok++; else miss.push("Campo vacío: " + f.label); });
  (sec.tables || []).forEach(t => {
    const rows = S.t[t.id] || [];
    let cells = 0, full = 0;
    rows.forEach(r => t.cols.forEach(c => { cells++; if (filled(r[c.k])) full++; }));
    tot += 2;
    if (rows.length) ok++; else miss.push("Tabla sin filas: " + t.label);
    if (cells && full === cells) ok++; else if (rows.length) miss.push(t.label + ": " + (cells - full) + " celda(s) vacía(s)");
  });
  (sec.checklists || []).forEach(l => {
    const arr = S.c[l.id] || [];
    l.items.forEach((it, i) => { tot++; if (arr[i] && arr[i].ok) ok++; });
    const pend = l.items.length - arr.filter(x => x && x.ok).length;
    if (pend) miss.push(l.label + ": " + pend + " ítem(s) sin marcar");
  });
  if (S.s[sec.id] !== "Validado") miss.push("Estado de la sección: " + S.s[sec.id]);
  return { pct: tot ? Math.round(ok * 100 / tot) : 100, miss };
}
function globalStats() {
  let sum = 0, val = 0;
  SECTIONS.forEach(s => { sum += secStats(s).pct; if (S.s[s.id] === "Validado") val++; });
  return { pct: Math.round(sum / SECTIONS.length), val };
}

/* ---------- navegación ---------- */
function refreshNav() {
  const g = globalStats();
  $("#gbar").style.width = g.pct + "%";
  $("#gtext").textContent = g.pct + "% completo · " + g.val + "/" + SECTIONS.length + " secciones validadas";
  $("#nav").innerHTML = STEPS.map((sec, i) => {
    const st = sec === FINAL ? null : secStats(sec);
    const stat = sec === FINAL ? "" : S.s[sec.id];
    const cls = stat === "Validado" ? "ok" : stat === "En revisión" ? "rev" : stat === "En progreso" ? "prog" : "";
    return `<li><button type="button" data-go="${i}" class="${i === S.cur ? "cur" : ""}" ${i === S.cur ? 'aria-current="step"' : ""}>
      <span class="dot ${cls}" aria-hidden="true"></span><span class="nn">${esc(sec.n)}</span><span class="nt">${esc(sec.title)}</span>${st ? `<span class="np">${st.pct}%</span>` : ""}</button></li>`;
  }).join("");
  $("#navsel").innerHTML = STEPS.map((sec, i) => `<option value="${i}" ${i === S.cur ? "selected" : ""}>${esc(sec.n + ". " + sec.title)}</option>`).join("");
}
function go(i) { S.cur = Math.max(0, Math.min(STEPS.length - 1, i)); render(); save(); window.scrollTo(0, 0); $("#main h2").focus(); }

/* ---------- render ---------- */
function fieldHTML(f) {
  const v = esc(S.v[f.id]); const ph = esc(f.ph || "");
  const id = "f_" + f.id;
  let input;
  if (f.type === "area") input = `<textarea id="${id}" data-f="${f.id}" rows="${Math.max(3, Math.min(10, String(S.v[f.id] || "").split("\n").length + 1))}" placeholder="${ph}">${v}</textarea>`;
  else if (f.type === "date") input = `<input id="${id}" type="date" data-f="${f.id}" value="${v}">`;
  else input = `<input id="${id}" type="text" data-f="${f.id}" value="${v}" placeholder="${ph}">`;
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}</div>`;
}
function cellHTML(t, c, r, ri) {
  const v = r[c.k] == null ? "" : r[c.k];
  const a = `data-t="${t.id}" data-r="${ri}" data-c="${c.k}" aria-label="${esc(c.label)} fila ${ri + 1}"`;
  if (c.type === "select") {
    const opts = c.options.includes(v) || !v ? c.options : [v].concat(c.options);
    return `<select ${a}><option value=""></option>${opts.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  }
  if (c.type === "area") return `<textarea ${a} rows="2">${esc(v)}</textarea>`;
  if (c.type === "date") return `<input type="date" ${a} value="${esc(v)}">`;
  if (c.type === "number") return `<input type="text" inputmode="decimal" ${a} value="${esc(v)}">`;
  return `<input type="text" ${a} value="${esc(v)}">`;
}
function tableHTML(t) {
  const rows = S.t[t.id] || [];
  return `<div class="tblock"><div class="thead"><h3>${esc(t.label)}</h3><span class="muted">${rows.length} fila(s)</span></div>
  <div class="tscroll"><table class="edit" style="min-width:${Math.max(700, t.cols.length * 150)}px"><colgroup>${t.cols.map(c => `<col style="width:${c.w || 10}%">`).join("")}<col style="width:44px"></colgroup>
  <thead><tr>${t.cols.map(c => `<th scope="col">${esc(c.label)}</th>`).join("")}<th scope="col"><span class="sr">Acciones</span></th></tr></thead>
  <tbody>${rows.map((r, ri) => `<tr>${t.cols.map(c => `<td>${cellHTML(t, c, r, ri)}</td>`).join("")}<td><button type="button" class="icon" data-del="${t.id}" data-r="${ri}" title="Eliminar fila" aria-label="Eliminar fila ${ri + 1}">✕</button></td></tr>`).join("")}</tbody></table></div>
  <button type="button" class="btn ghost small" data-add="${t.id}">+ Agregar fila</button></div>`;
}
function checklistHTML(l) {
  const arr = S.c[l.id] || [];
  return `<fieldset class="check"><legend>${esc(l.label)}</legend>${l.items.map((it, i) => {
    const x = arr[i] || { ok: false, nota: "" };
    return `<div class="ci"><label><input type="checkbox" data-cl="${l.id}" data-i="${i}" ${x.ok ? "checked" : ""}> <span>${esc(it)}</span></label>
    <input type="text" class="nota" data-cn="${l.id}" data-i="${i}" value="${esc(x.nota)}" placeholder="Nota / evidencia" aria-label="Nota: ${esc(it)}"></div>`;
  }).join("")}</fieldset>`;
}
function render() {
  const sec = STEPS[S.cur];
  const main = $("#main");
  if (sec === FINAL) { main.innerHTML = finalHTML(); refreshNav(); return; }
  const st = secStats(sec);
  main.innerHTML = `
  <header class="sh"><p class="kicker">Paso ${esc(sec.n)} de ${STEPS.length - 1}</p><h2 tabindex="-1">${esc(sec.title)}</h2>
  <div class="guide"><strong>Cómo completarlo:</strong> ${esc(sec.guide)}<br><span class="muted">Rol responsable sugerido: ${esc(sec.roles)}</span></div>
  <div class="statusrow"><label for="secstat">Estado de la sección</label>
  <select id="secstat" data-s="${sec.id}">${STATUS.map(x => `<option ${S.s[sec.id] === x ? "selected" : ""}>${x}</option>`).join("")}</select>
  <span class="pill" id="secpct">${st.pct}% completo</span></div></header>
  ${sec.dateTool ? `<div class="tool"><button type="button" class="btn small" id="calcDates">Calcular fechas desde la fecha de inicio</button><span class="muted">${S.v.fechaInicio ? "Inicio: " + esc(S.v.fechaInicio) : "Primero cargá la fecha de inicio en el paso 0."}</span></div>` : ""}
  ${(sec.fields || []).length ? `<div class="fields">${sec.fields.map(fieldHTML).join("")}</div>` : ""}
  ${(sec.checklists || []).map(checklistHTML).join("")}
  ${(sec.tables || []).map(tableHTML).join("")}
  <div class="field"><label for="obs_${sec.id}">Observaciones de la sección (auditoría / comentarios del equipo)</label>
  <textarea id="obs_${sec.id}" data-f="obs_${sec.id}" rows="2" placeholder="Hallazgos, dudas, quién revisó y cuándo">${esc(S.v["obs_" + sec.id] || "")}</textarea></div>
  <nav class="pager" aria-label="Pasos"><button type="button" class="btn ghost" data-go="${S.cur - 1}" ${S.cur === 0 ? "disabled" : ""}>← Anterior</button>
  <button type="button" class="btn" data-go="${S.cur + 1}">Siguiente →</button></nav>`;
  refreshNav();
  requestAnimationFrame(() => main.querySelectorAll("table.edit textarea").forEach(autosize));
}
function finalHTML() {
  const items = SECTIONS.map((s, i) => { const st = secStats(s); return { s, i, st }; });
  const g = globalStats();
  return `<header class="sh"><p class="kicker">Paso final</p><h2 tabindex="-1">${esc(FINAL.title)}</h2>
  <div class="guide">Auditoría de completitud: revisá lo que falta en cada sección y marcá cada una como <strong>Validado</strong> cuando el equipo la apruebe. Después descargá el documento.</div></header>
  <div class="kpis"><div><b>${g.pct}%</b><span>completitud</span></div><div><b>${g.val}/${SECTIONS.length}</b><span>secciones validadas</span></div>
  <div><b>${(S.t.rfs || []).length}</b><span>requisitos funcionales</span></div><div><b>${(S.t.back || []).length}</b><span>tareas en backlog</span></div></div>
  <div class="exportbox"><h3>Descargar</h3><div class="btns">
  <button type="button" class="btn" data-exp="xlsx">Excel editable (.xlsx)</button>
  <button type="button" class="btn" data-exp="docx">Word editable (.docx)</button>
  <button type="button" class="btn" data-exp="pdf">PDF (imprimir / guardar como PDF)</button>
  <button type="button" class="btn ghost" data-exp="json">Respaldo (.json)</button></div>
  <p class="muted">Para el PDF, en la ventana de impresión elegí «Guardar como PDF».</p></div>
  <h3>Pendientes por sección</h3>
  <div class="audit">${items.map(({ s, i, st }) => `<details ${st.miss.length && S.s[s.id] !== "Validado" ? "" : ""}><summary><span class="dot ${S.s[s.id] === "Validado" ? "ok" : S.s[s.id] === "En revisión" ? "rev" : S.s[s.id] === "En progreso" ? "prog" : ""}" aria-hidden="true"></span>
  ${esc(s.n + ". " + s.title)} <span class="np">${st.pct}% · ${st.miss.length} pendiente(s)</span></summary>
  <ul>${st.miss.map(m => `<li>${esc(m)}</li>`).join("") || "<li>Sin pendientes.</li>"}</ul><button type="button" class="btn ghost small" data-go="${i}">Ir a la sección</button></details>`).join("")}</div>`;
}

/* ---------- eventos ---------- */
document.addEventListener("input", e => {
  const el = e.target, d = el.dataset;
  if (d.f) { S.v[d.f] = el.value; }
  else if (d.t) { S.t[d.t][+d.r][d.c] = el.value; }
  else if (d.cn) { S.c[d.cn][+d.i].nota = el.value; }
  else return;
  if (el.tagName === "TEXTAREA") autosize(el);
  save(); updatePct();
});
function autosize(el) { el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (d.cl) { S.c[d.cl][+d.i].ok = el.checked; save(); updatePct(); }
  else if (d.s) { S.s[d.s] = el.value; save(); }
  else if (el.id === "navsel") go(+el.value);
  else if (el.id === "importFile" && el.files[0]) importJSON(el.files[0]);
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.go !== undefined) go(+d.go);
  else if (d.add) { const t = findTable(d.add); const row = {}; t.cols.forEach(c => row[c.k] = ""); if (d.add === "back") { row.resp = "Por asignar / validar"; row.est = "Propuesto — pendiente de validación"; } S.t[d.add].push(row); save(); render(); }
  else if (d.del) { if (confirm("¿Eliminar esta fila?")) { S.t[d.del].splice(+d.r, 1); save(); render(); } }
  else if (d.exp) doExport(d.exp);
  else if (b.id === "calcDates") calcDates();
  else if (b.id === "btnReset") { if (confirm("Esto borra todo lo cargado en este navegador y vuelve al borrador inicial. ¿Seguro? (Exportá un respaldo antes.)")) { S = defaults(); try { localStorage.removeItem(KEY); } catch (x) {} render(); setSaved(); } }
  else if (b.id === "btnImport") $("#importFile").click();
});
function updatePct() { const sec = STEPS[S.cur]; if (sec !== FINAL && $("#secpct")) $("#secpct").textContent = secStats(sec).pct + "% completo"; }
function findTable(id) { for (const s of SECTIONS) for (const t of (s.tables || [])) if (t.id === id) return t; }
function calcDates() {
  if (!S.v.fechaInicio) { alert("Primero cargá la fecha de inicio en el paso 0."); return; }
  const base = new Date(S.v.fechaInicio + "T12:00:00");
  const iso = d => d.toISOString().slice(0, 10);
  S.t.back.forEach(r => { const w = parseInt(r.sem, 10); if (isNaN(w)) return; const a = new Date(base); a.setDate(a.getDate() + w * 7); const b = new Date(a); b.setDate(b.getDate() + 6); r.ini = iso(a); r.fin = iso(b); });
  save(); render();
}
function importJSON(file) {
  const fr = new FileReader();
  fr.onload = () => { try { const p = JSON.parse(fr.result); const d = defaults(); ["v", "t", "c", "s"].forEach(k => Object.assign(d[k], p[k] || {})); d.cur = 0; S = d; save(); render(); alert("Respaldo importado."); } catch (e) { alert("El archivo no es un respaldo válido."); } };
  fr.readAsText(file);
}

/* ---------- modelo de documento (para Word / PDF) ---------- */
function docModel() {
  const B = [];
  B.push({ k: "title", t: (S.v.proyecto || "Proyecto") + " — Documento del MVP" });
  B.push({ k: "sub", t: (S.v.version || "") + " · Generado el " + new Date().toLocaleDateString("es-AR") });
  SECTIONS.forEach(sec => {
    B.push({ k: "h1", t: sec.n + ". " + sec.title });
    B.push({ k: "meta", t: "Estado: " + S.s[sec.id] + " · Completitud: " + secStats(sec).pct + "% · Responsable sugerido: " + sec.roles });
    (sec.fields || []).forEach(f => B.push({ k: "field", l: f.label, t: S.v[f.id] || "" }));

/* ---------- ZIP (sin compresión) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);

    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);

  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri" w:eastAsia="Calibri"/><w:sz w:val="21"/><w:lang w:val="es-AR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="60"/></w:pPr><w:rPr><w:b/><w:color w:val="0E2A3F"/><w:sz w:val="40"/></w:rPr></w:style>

/* ---------- PDF (impresión) ---------- */
function exportPDF() {
  $("#report").innerHTML = docModel().map(b => {
    if (b.k === "title") return `<h1>${esc(b.t)}</h1>`;
    if (b.k === "sub") return `<p class="rsub">${esc(b.t)}</p>`;
    if (b.k === "h1") return `<h2>${esc(b.t)}</h2>`;
    if (b.k === "meta") return `<p class="rmeta">${esc(b.t)}</p>`;
    if (b.k === "field") return `<div class="rf"><b>${esc(b.l)}</b><div>${esc(b.t || "—").replace(/\n/g, "<br>")}</div></div>`;
    if (b.k === "table") return `<h3>${esc(b.t)}</h3><table><colgroup>${b.w.map(w => `<col style="width:${w}%">`).join("")}</colgroup><thead><tr>${b.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${esc(c).replace(/\n/g, "<br>")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    return "";
  }).join("");
  setTimeout(() => window.print(), 50);
}

function fname(ext) { return (S.v.proyecto || "Proyecto").replace(/[^\wÁÉÍÓÚáéíóúÑñ]+/g, "_").replace(/^_|_$/g, "") + "_MVP_" + new Date().toISOString().slice(0, 10) + "." + ext; }
let DL = null;
if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(d => { DL = d; }).catch(() => {});
function download(blob, name) {
  if (DL) { DL.save({ filename: name, data: blob }).catch(e => { if (e && e.code !== "declined") anchorDownload(blob, name); }); return; }
  anchorDownload(blob, name);
}
function anchorDownload(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function doExport(k) {
  if (k === "xlsx") exportXLSX();
  else if (k === "docx") exportDOCX();
  else if (k === "pdf") exportPDF();
  else if (k === "json") download(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }), fname("json"));
}
window.NIRA = { exportXLSX, exportDOCX, docModel, state: () => S };

render(); setSaved();
})();
